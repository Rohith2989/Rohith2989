    .y { fill: #9a6700; }
    .o { fill: #bc4c00; }
    .fade { opacity: 0; animation: fi 0.32s ease-out forwards; }
    .wipe { clip-path: inset(-4px 101% -4px -6px); clip-path: inset(-4px 101% -4px -6px) fill-box; animation: wp 0.9s steps(40, end) forwards; }
    .cur { opacity: 0; animation: fi 0.2s ease-out 14.2s forwards, bl 1.1s steps(2, jump-none) 14.6s infinite; }
    .live { animation: pulse 2s ease-in-out infinite; }
    .px { opacity: 0; animation: fi 0.3s ease-out forwards; }
    @keyframes fi { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wp { to { clip-path: inset(-4px -6px -4px -6px); clip-path: inset(-4px -6px -4px -6px) fill-box; } }
    @keyframes bl { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .wipe, .px, .cur, .live { animation: none; }
      .fade, .px, .cur { opacity: 1; }
      .wipe { clip-path: none; }
    }
  </style>

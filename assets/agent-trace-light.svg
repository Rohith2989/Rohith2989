  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #1f2328; }
    .small { font-size: 12px; }
    .f { fill: #1f2328; }
    .d { fill: #656d76; }
    .g { fill: #1a7f37; }
    .c { fill: #0969da; }
